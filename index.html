<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>This party has passed</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16221b;--muted:#5b6a61;--ac:#1d7a4d}
@media (prefers-color-scheme:dark){:root{--bg:#101713;--card:#18221c;--ink:#e9efe9;--muted:#9bab9f;--ac:#4fbf86}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px;box-sizing:border-box}
main{background:var(--card);border-radius:18px;padding:32px 28px;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.b{font-size:44px;line-height:1}
h1{font-size:26px;margin:12px 0 8px}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="b" aria-hidden="true">🎉</div>
  <h1>This party has passed</h1>
  <p>Thanks to everyone who came and celebrated with us.</p>
</main>
</body>
</html>
